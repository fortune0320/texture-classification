name: GLCM Texture Classification CI/CD

on:
  push:
    branches: ["**"]  # 所有分支推送触发
  pull_request:
    branches: ["main"]  # PR到main分支触发

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 适配Ubuntu 24.04的系统依赖（替换libgl1-mesa-glx为libgl1）
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install DVC (数据版本控制工具)
        run: |
          pip install dvc[dagshub]  

      - name: Configure DVC remote (connect to DagsHub)
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote add -d dagshub https://dagshub.com/${DAGSHUB_USERNAME}/texture-classification.dvc
          dvc remote modify dagshub auth basic
          dvc remote modify dagshub user ${DAGSHUB_USERNAME}
          dvc remote modify dagshub password ${DAGSHUB_TOKEN}

      - name: Pull dataset with DVC
        run: dvc pull

      - name: Check code formatting with Black
        run: black --check src/ tests/

      - name: Lint code with Flake8
        run: |
          flake8 src/ tests/ --count \
            --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Run unit tests with pytest
        run: pytest tests/ -v

      - name: Run training with MLflow tracking
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          BASE_DIR: "data"
        run: |
          echo "Starting training with MLflow tracking..."
          python src/train.py
          echo "Training completed. MLflow logs synced to DagsHub."

      - name: Sync results to DagsHub
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc push
          git config --global user.email "ci-cd@github.com"
          git config --global user.name "GitHub Actions CI"
          dvc metrics show --json > metrics.json || echo "No DVC metrics to export"
          git add metrics.json
          git commit -m "ci: update metrics from GitHub Actions" || echo "No metrics changes"
          git remote add dagshub https://${DAGSHUB_USERNAME}:${DAGSHUB_TOKEN}@dagshub.com/${DAGSHUB_USERNAME}/texture-classification.git
          git push dagshub HEAD:${{ github.ref_name }} || echo "No changes to push"
