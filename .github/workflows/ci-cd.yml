name: Texture Classification CI/CD

# 触发条件：支持自动（push/pull_request）和手动触发
on:
  push:
    branches: [ dev, main, feature/complete-ci-cd ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:  # 手动触发按钮（添加此行）

jobs:
  # 第一阶段：代码质量检查与数据处理
  quality-assurance:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 拉取完整历史，确保DVC正常工作
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # 安装项目依赖
        pip install black flake8 pytest  # 安装质量检查工具
        pip install dvc dvc[ssh]  # 安装DVC数据版本控制
    
    - name: Configure DVC remote (Dagshub)
      run: |
        dvc remote add -d dagshub https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/texture-classification.dvc
        dvc remote modify dagshub auth basic
        dvc remote modify dagshub user ${{ secrets.DAGSHUB_USERNAME }}
        dvc remote modify dagshub password ${{ secrets.DAGSHUB_TOKEN }}
    
    - name: Pull data with DVC
      run: dvc pull  # 从Dagshub拉取数据集
    
    - name: Code formatting check with black
      run: black --check src/ tests/  # 检查代码格式
    
    - name: Code linting with flake8
      run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics  # 检查代码规范
    
    - name: Run unit tests
      run: pytest tests/ -v  # 执行单元测试
    
    - name: Sync results to Dagshub
      run: |
        dvc push  # 推送更新的数据到Dagshub
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions"
        dvc metrics show --type json > metrics.json  # 导出指标
        git add metrics.json
        git commit -m "ci: update metrics from GitHub Actions" || echo "No metrics changes to commit"
        git push origin HEAD:${{ github.ref_name }} || echo "No changes to push"

  # 第二阶段：构建并推送Docker镜像（依赖第一阶段成功）
  build-docker:
    needs: quality-assurance  # 等待质量检查通过后执行
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/texture-classifier
        tags: |
          type=sha,format=short
          type=ref,event=branch
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
